[project]
name = "resume-analyzer-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]
# Dev-only scripts: fixed argv lists and an intentionally public demo password.
"scripts/**" = ["S105", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/fixtures/"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pymupdf.*", "docx.*", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
